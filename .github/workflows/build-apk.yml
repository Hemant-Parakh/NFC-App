name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Every build gets a higher versionCode, so Android accepts it as an update.
  TAPDECK_VERSION_CODE: ${{ github.run_number }}
  TAPDECK_VERSION_NAME: 1.2.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require signing password
        env:
          TAPDECK_KEYSTORE_PASSWORD: ${{ secrets.TAPDECK_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$TAPDECK_KEYSTORE_PASSWORD" ]; then
            echo "::error title=Signing secret missing::Add the repository secret TAPDECK_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions). Every APK must be signed with the same key to update the installed app."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package (the action's default) no longer exists in cmdline-tools 16+
          packages: 'platform-tools'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          TAPDECK_KEYSTORE_PASSWORD: ${{ secrets.TAPDECK_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/TapDeck.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs artifacts/TapDeck.apk | head -3

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapDeck-${{ env.TAPDECK_VERSION_NAME }}
          path: artifacts/TapDeck.apk
          retention-days: 90

      - name: Release notes from commit
        run: git log -1 --format=%B | grep -viE '^(Co-Authored-By|Claude-Session|Signed-off-by):' > artifacts/notes.md

      # The installed app checks GitHub's "latest release" for updates.
      - name: Publish release (default branch only)
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TAPDECK_VERSION_NAME }}
          name: TapDeck ${{ env.TAPDECK_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body_path: artifacts/notes.md
          files: artifacts/TapDeck.apk
          make_latest: true
